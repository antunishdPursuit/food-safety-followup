<text x="40" y="356" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#475569">BACKEND</text>
<rect x="20" y="438" width="1560" height="150" rx="8" fill="#f8f9fb"/>
<text x="40" y="516" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#475569">SCREENS</text>
<rect x="20" y="598" width="1560" height="150" rx="8" fill="#f1f3f7"/>
<text x="40" y="668" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#475569">MANAGER</text>
<text x="40" y="688" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#475569">(only user)</text>
<rect x="180" y="138" width="200" height="110" rx="10" fill="#e8f0fe" stroke="#1a56db" stroke-width="2.5"/>
<text x="280.0" y="170" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#111827">Sweetgreen pages</text>
<text x="280.0" y="196" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#374151">38 NYC locations:</text>
<text x="280.0" y="216" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#374151">name, address,</text>
<text x="280.0" y="236" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#374151">map position, phone</text>
<rect x="760" y="138" width="200" height="110" rx="10" fill="#e8f0fe" stroke="#1a56db" stroke-width="2.5"/>
