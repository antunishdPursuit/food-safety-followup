<text x="860.0" y="196" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#374151">inspection results,</text>
<text x="860.0" y="216" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#374151">one row per citation</text>
<rect x="1340" y="138" width="200" height="110" rx="10" fill="#fff4e0" stroke="#c76a00" stroke-width="2.5"/>
<text x="1440.0" y="170" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#111827">Demo checks</text>
<text x="1440.0" y="196" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#374151">fictional, seeded,</text>
<text x="1440.0" y="216" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#374151">labeled on every card</text>
<rect x="180" y="298" width="200" height="110" rx="10" fill="#eef1f4" stroke="#4b5563" stroke-width="2.5"/>
<text x="280.0" y="330" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#111827">Directory</text>
<text x="280.0" y="356" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#374151">saved snapshot of</text>
<text x="280.0" y="376" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#374151">the 38 locations</text>
<rect x="470" y="298" width="200" height="110" rx="10" fill="#eef1f4" stroke="#4b5563" stroke-width="2.5"/>
<text x="570.0" y="330" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#111827">Match to permit</text>
<text x="570.0" y="356" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#374151">address + name =</text>
<text x="570.0" y="376" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#374151">verified; position</text>
<text x="570.0" y="396" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#374151">or phone = candidate</text>
<rect x="760" y="298" width="200" height="110" rx="10" fill="#eef1f4" stroke="#4b5563" stroke-width="2.5"/>
<text x="860.0" y="330" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#111827">Import</text>
<text x="860.0" y="356" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#374151">rows grouped into</text>
<text x="860.0" y="376" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#374151">inspections; retried;</text>
<text x="860.0" y="396" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#374151">a failure keeps data</text>
<rect x="1050" y="298" width="200" height="110" rx="10" fill="#eef1f4" stroke="#4b5563" stroke-width="2.5"/>
<text x="1150.0" y="330" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#111827">Store and rules</text>
<text x="1150.0" y="356" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#374151">locked JSON file;</text>
<text x="1150.0" y="376" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#374151">flags, repeats,</text>
<text x="1150.0" y="396" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#374151">regional signals</text>
<rect x="1340" y="298" width="200" height="110" rx="10" fill="#eef1f4" stroke="#4b5563" stroke-width="2.5"/>
<text x="1440.0" y="330" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#111827">API</text>
<text x="1440.0" y="356" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#374151">5 endpoints +</text>
<text x="1440.0" y="376" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#374151">protected import</text>
<rect x="1340" y="458" width="200" height="110" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2.5"/>
<text x="1440.0" y="490" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#111827">Screens</text>
<text x="1440.0" y="516" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#374151">map and list, detail,</text>
<text x="1440.0" y="536" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#374151">compare, follow-up form</text>
<rect x="470" y="618" width="200" height="110" rx="10" fill="#e9f7ef" stroke="#1e8e5a" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="570.0" y="650" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#111827">Confirm candidates</text>
<text x="570.0" y="676" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#374151">the manager picks</text>
<text x="570.0" y="696" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#374151">the right permit</text>
<rect x="1050" y="618" width="200" height="110" rx="10" fill="#e9f7ef" stroke="#1e8e5a" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="1150.0" y="650" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#111827">Review and decide</text>
<text x="1150.0" y="676" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#374151">flags, compare,</text>
<text x="1150.0" y="696" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#374151">link or dismiss</text>
<rect x="1340" y="618" width="200" height="110" rx="10" fill="#e9f7ef" stroke="#1e8e5a" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="1440.0" y="650" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#111827">Act and close</text>
<text x="1440.0" y="676" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#374151">create a follow-up;</text>
<text x="1440.0" y="696" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="middle" fill="#374151">Complete needs a note</text>
