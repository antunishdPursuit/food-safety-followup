<rect x="20" y="765" width="1560" height="120" rx="8" fill="#f3f4f6"/>
<text x="40" y="794" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#111827">Never inferred</text>
<text x="40" y="816" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#374151">Compliance from missing data,</text>
<text x="40" y="837" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#374151">or a correction from city data.</text>
<text x="560" y="794" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#111827">Failures stay contained</text>
<text x="560" y="816" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#374151">A failed city refresh keeps stored records;</text>
<text x="560" y="837" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#374151">tests never call the live services.</text>
<text x="1080" y="794" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" text-anchor="start" fill="#111827">Manager decides</text>
<text x="1080" y="816" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#374151">Dashed boxes are the only places a person</text>
<text x="1080" y="837" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="normal" text-anchor="start" fill="#374151">changes what the app believes.</text>
<text x="40" y="872" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#4b5563">Live data, 2026-11-09: 38 of 38 locations verified, 118 inspections, 271 citations (npm run data:status).</text>
